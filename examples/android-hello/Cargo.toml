[package]
name = "android-hello"
version = "0.0.1"
edition.workspace = true
license.workspace = true
description = "A Rune app on Android (NativeActivity, no Gradle): scripts/android-apk.sh builds the APK."

[lib]
# The shared library NativeActivity loads (`android.app.lib_name` in AndroidManifest.xml); `lib`
# lets the desktop binary below use the same view.
crate-type = ["cdylib", "lib"]

[[bin]]
name = "android-hello"
path = "src/main.rs"

[dependencies]
rune = { path = "../../crates/rune" }

[lints]
workspace = true
